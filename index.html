<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journey Yields Crescent — 北海道</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --snow: #f9f7f4;
  --snow-deep: #f0ece6;
  --lavender: #b8a6c4;
  --lavender-light: #d4c8dc;
  --lavender-deep: #7a6b8a;
  --wood: #8b7355;
  --wood-light: #c4a882;
  --sage: #7d9b7e;
  --sage-light: #a8c3a6;
  --forest: #3d5a40;
  --ink: #2c2c2c;
  --ink-light: #5a5a5a;
  --mist: rgba(255,255,255,0.6);
  --fs-hero: clamp(2.8rem, 7vw, 5.5rem);
  --fs-h2: clamp(1.5rem, 3.5vw, 2.2rem);
  --fs-body: clamp(0.95rem, 2vw, 1.05rem);
  --fs-small: 0.8rem;
}

html { scroll-behavior: smooth; font-size: 16px; }

body {
  font-family: "Noto Sans SC", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--snow);
  color: var(--ink);
  line-height: 2;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.serif { font-family: "Noto Serif SC", "Songti SC", serif; }

/* Snow canvas */
#snowCanvas {
  position: fixed;
  inset: 0;
  z-index: 9998;
  pointer-events: none;
}

/* Nav */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: clamp(1rem, 2.5vw, 1.8rem) clamp(1.5rem, 4vw, 3rem);
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: background 0.5s, box-shadow 0.5s;
}
.nav.scrolled {
  background: rgba(249,247,244,0.88);
  backdrop-filter: blur(16px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.04);
}
.nav-logo {
  font-family: "Noto Serif SC", serif;
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: 0.15em;
  transition: opacity 0.5s;
}
.nav-logo .dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--lavender);
  margin-left: 4px;
  vertical-align: middle;
  margin-bottom: 2px;
}

.music-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1.5px solid var(--lavender-light);
  background: transparent;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.4s;
  color: var(--lavender-deep);
}
.music-btn:hover { border-color: var(--lavender); background: rgba(184,166,196,0.1); }
.music-btn svg { width: 16px; height: 16px; }
.music-btn.playing { border-color: var(--sage); background: rgba(125,155,126,0.1); color: var(--sage); }
.music-btn.playing svg { animation: spin 5s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Hero */
.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 6rem 2rem 4rem;
  background: linear-gradient(180deg, 
    #ece4f0 0%,
    #e8dfec 15%,
    #f0ece6 40%,
    var(--snow) 70%
  );
  overflow: hidden;
}

/* Mountain silhouette */
.mountain {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  z-index: 2;
  height: clamp(180px, 30vw, 320px);
}

.mountain svg { width: 100%; height: 100%; display: block; }

/* Mist */
.mist {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  z-index: 3;
  height: 60px;
  background: linear-gradient(180deg, transparent 0%, var(--snow) 100%);
}

/* Lavender field hint */
.lavender-field {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  z-index: 1;
  height: 30%;
  opacity: 0.6;
}

.hero-content {
  position: relative;
  z-index: 10;
  text-align: center;
  max-width: 640px;
  padding-bottom: clamp(100px, 20vw, 200px);
}

.hero-pre {
  font-size: var(--fs-small);
  letter-spacing: 0.35em;
  color: var(--lavender-deep);
  font-weight: 500;
  margin-bottom: 1.5rem;
  text-transform: uppercase;
}

.hero-name {
  font-family: "Noto Serif SC", serif;
  font-size: var(--fs-hero);
  font-weight: 600;
  line-height: 1.2;
  color: var(--ink);
  margin-bottom: 1.2rem;
  letter-spacing: 0.04em;
}

.hero-name .hl {
  color: var(--lavender);
  font-weight: 700;
}

.hero-sub {
  font-size: var(--fs-body);
  color: var(--ink-light);
  max-width: 28ch;
  margin: 0 auto;
  font-weight: 300;
}

.scroll-hint {
  position: absolute;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  color: var(--lavender-deep);
  font-size: var(--fs-small);
  animation: fadeFloat 3s ease-in-out infinite;
  cursor: pointer;
  opacity: 0.7;
}
.scroll-hint svg { width: 16px; height: 16px; }
@keyframes fadeFloat {
  0%, 100% { opacity: 0.4; transform: translateX(-50%) translateY(0); }
  50% { opacity: 0.9; transform: translateX(-50%) translateY(6px); }
}

/* Profile section */
.profile {
  padding: clamp(4rem, 8vw, 7rem) clamp(2rem, 6vw, 4rem);
  position: relative;
  background: var(--snow);
}

.profile-inner {
  max-width: 900px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: clamp(2rem, 5vw, 4rem);
  align-items: center;
}

.profile-photo {
  width: clamp(160px, 22vw, 220px);
  height: clamp(160px, 22vw, 220px);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}

.profile-photo img {
  width: 100%; height: 100%;
  object-fit: cover;
  filter: brightness(0.96);
  transition: filter 0.5s;
}

.profile-photo::after {
  content: '';
  position: absolute;
  inset: -6px;
  border: 1px solid var(--lavender-light);
  border-radius: 3px;
  pointer-events: none;
}

.profile-text h2 {
  font-family: "Noto Serif SC", serif;
  font-size: var(--fs-h2);
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 0.5rem;
}

.profile-loc {
  font-size: var(--fs-small);
  color: var(--lavender-deep);
  letter-spacing: 0.15em;
  font-weight: 500;
  margin-bottom: 1.2rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.profile-loc::before {
  content: '✦';
  font-size: 0.6rem;
  color: var(--lavender);
}

.profile-desc {
  font-size: var(--fs-body);
  color: var(--ink-light);
  line-height: 2.1;
  font-weight: 300;
}

/* Quote section */
.quote-section {
  background: var(--snow-deep);
  padding: clamp(4rem, 8vw, 6rem) clamp(2rem, 6vw, 4rem);
  text-align: center;
  position: relative;
  overflow: hidden;
}

.quote-section::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--lavender-light), transparent);
}

.quote-ornament {
  font-size: 3rem;
  color: var(--lavender-light);
  margin-bottom: 1rem;
  opacity: 0.5;
}

.quote-text {
  font-family: "Noto Serif SC", serif;
  font-size: clamp(1.3rem, 2.8vw, 1.8rem);
  font-weight: 600;
  color: var(--ink);
  max-width: 24ch;
  margin: 0 auto 1.5rem;
  line-height: 1.8;
}

.quote-divider {
  width: 40px;
  height: 2px;
  background: var(--lavender);
  margin: 0 auto 1rem;
}

.quote-attr {
  font-size: var(--fs-small);
  color: var(--ink-light);
  letter-spacing: 0.15em;
  font-weight: 500;
}

/* Kanji strip */
.kanji-strip {
  padding: clamp(3rem, 6vw, 5rem) clamp(2rem, 4vw, 3rem);
  display: flex;
  justify-content: center;
  gap: clamp(2rem, 5vw, 5rem);
  flex-wrap: wrap;
  background: var(--snow);
}

.kanji-item {
  text-align: center;
  min-width: 80px;
}

.kanji-char {
  font-family: "Noto Serif SC", serif;
  font-size: clamp(2.5rem, 5vw, 4rem);
  color: var(--lavender);
  font-weight: 700;
  line-height: 1;
  margin-bottom: 0.4rem;
  opacity: 0.7;
}

.kanji-reading {
  font-size: var(--fs-small);
  color: var(--lavender-deep);
  letter-spacing: 0.1em;
}

/* Contact */
.contact {
  padding: clamp(4rem, 8vw, 6rem) clamp(2rem, 6vw, 4rem);
  background: var(--snow-deep);
  text-align: center;
}

.contact-title {
  font-family: "Noto Serif SC", serif;
  font-size: var(--fs-h2);
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 2.5rem;
}

.contact-grid {
  display: flex;
  justify-content: center;
  gap: clamp(1.5rem, 3vw, 2.5rem);
  flex-wrap: wrap;
  max-width: 550px;
  margin: 0 auto;
}

.contact-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.6rem;
  padding: 1.5rem 2rem;
  text-decoration: none;
  color: var(--ink);
  background: var(--snow);
  border-radius: 2px;
  min-width: 140px;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
}

.contact-card::after {
  content: '';
  position: absolute;
  inset: 0;
  border: 1px solid transparent;
  border-radius: 2px;
  transition: border-color 0.4s;
}

.contact-card:hover::after { border-color: var(--lavender-light); }
.contact-card:hover { transform: translateY(-3px); }

.contact-card svg { width: 22px; height: 22px; color: var(--lavender); }
.contact-card-label {
  font-size: var(--fs-small);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 500;
  color: var(--ink-light);
}
.contact-card-value {
  font-size: 0.95rem;
  font-weight: 500;
}

/* Footer */
.footer {
  padding: clamp(2rem, 4vw, 3rem);
  text-align: center;
  font-size: var(--fs-small);
  color: var(--ink-light);
  opacity: 0.4;
  background: var(--snow);
}

/* Reveal */
.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
              transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}
.reveal.visible { opacity: 1; transform: translateY(0); }
.delay-1 { transition-delay: 0.12s; }
.delay-2 { transition-delay: 0.24s; }
.delay-3 { transition-delay: 0.36s; }

@media (max-width: 768px) {
  .profile-inner {
    grid-template-columns: 1fr;
    text-align: center;
    justify-items: center;
  }
  .profile-loc { justify-content: center; }
  .kanji-strip { gap: 1.5rem; }
}

@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
  html { scroll-behavior: auto; }
  #snowCanvas { display: none; }
}
</style>
</head>
<body>

<canvas id="snowCanvas"></canvas>

<nav class="nav" id="nav">

      <path d="M0,320 L0,220 L140,180 L240,210 L300,160 L380,200 L440,130 L520,185 L580,120 L650,170 L710,100 L780,160 L840,80 L920,140 L980,70 L1060,130 L1120,60 L1200,115 L1280,65 L1360,110 L1440,55 L1440,320 Z" fill="#c4b8cc" opacity="0.5"/>
      <path d="M0,320 L0,270 L160,240 L280,265 L360,220 L450,255 L530,200 L620,240 L700,185 L790,225 L870,170 L960,210 L1040,160 L1130,200 L1220,155 L1320,195 L1440,150 L1440,320 Z" fill="#f0ece6" opacity="0.8"/>

<audio id="bgm" src="JYC.mp3" loop preload="none"></audio>

<script>
// Snowfall
const canvas = document.getElementById('snowCanvas');
const ctx = canvas.getContext('2d');
let flakes = [];
const maxFlakes = 60;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Flake {
  constructor() {
    this.reset(true);
  }
  reset(init) {
    this.x = Math.random() * canvas.width;
    this.y = init ? Math.random() * canvas.height : -10;
    this.r = Math.random() * 2.5 + 1;
    this.opacity = Math.random() * 0.5 + 0.3;
    this.speed = Math.random() * 0.6 + 0.2;
    this.wind = Math.random() * 0.4 - 0.2;
  }
  update() {
    this.y += this.speed;
    this.x += this.wind + Math.sin(this.y * 0.02) * 0.3;
    if (this.y > canvas.height + 10) { this.y = -10; this.x = Math.random() * canvas.width; }
    if (this.x > canvas.width + 10) this.x = -10;
    if (this.x < -10) this.x = canvas.width + 10;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
    ctx.fill();
  }
}

for (let i = 0; i < maxFlakes; i++) flakes.push(new Flake());

function animateSnow() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  flakes.forEach(f => { f.update(); f.draw(); });
  requestAnimationFrame(animateSnow);
}
animateSnow();

// Nav scroll
const nav = document.getElementById('nav');
window.addEventListener('scroll', () => {
  nav.classList.toggle('scrolled', window.scrollY > 40);
});

// Music
const musicBtn = document.getElementById('musicBtn');
const bgm = document.getElementById('bgm');
let playing = false;
musicBtn.addEventListener('click', () => {
  if (playing) { bgm.pause(); musicBtn.classList.remove('playing'); playing = false; }
  else { bgm.play().then(() => { musicBtn.classList.add('playing'); playing = true; }).catch(() => {}); }
});

// Reveal
const obs = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.12, rootMargin: '0px 0px -30px 0px' });
document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
</script>
