<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journey Yields Crescent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: oklch(97% 0.005 84);
  --text: oklch(18% 0.01 84);
  --text-muted: oklch(45% 0.01 84);
  --accent: oklch(58% 0.15 58);
  --accent-glow: oklch(65% 0.18 62);
  --surface: oklch(99% 0.003 84);
  --border: oklch(90% 0.01 84);
  --fs-hero: clamp(3.2rem, 8vw, 7rem);
  --fs-h1: clamp(2rem, 5vw, 3.5rem);
  --fs-body: clamp(1rem, 2.5vw, 1.15rem);
  --fs-small: 0.875rem;
}

html { scroll-behavior: smooth; font-size: 16px; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.serif { font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; }

/* Grain overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 9999;
  pointer-events: none;
  opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* Nav */
nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: clamp(1rem, 3vw, 2rem);
  display: flex;
  justify-content: space-between;
  align-items: center;
  mix-blend-mode: difference;
  color: #fff;
}

.nav-logo {
  font-family: "Noto Serif SC", serif;
  font-weight: 900;
  font-size: 1.25rem;
  letter-spacing: 0.05em;
}

.music-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.4);
  background: transparent;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s ease;
  color: #fff;
}
.music-btn:hover { border-color: #fff; transform: scale(1.05); }
.music-btn.playing { border-color: var(--accent-glow); background: rgba(255,255,255,0.1); }
.music-btn svg { width: 18px; height: 18px; }
.music-btn.playing svg { animation: spin 3s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Hero */
.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  padding: clamp(2rem, 8vw, 8rem);
  position: relative;
  overflow: hidden;
}

.hero-content {
  max-width: 1400px;
  margin: 0 auto;
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: clamp(3rem, 6vw, 8rem);
  align-items: center;
}

.hero-text { position: relative; z-index: 2; }

.hero-tag {
  font-size: var(--fs-small);
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--text-muted);
  margin-bottom: 1.5rem;
  font-weight: 600;
}

.hero-name {
  font-family: "Noto Serif SC", serif;
  font-size: var(--fs-hero);
  font-weight: 900;
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin-bottom: 1.5rem;
  color: var(--text);
}

.hero-name .highlight {
  color: var(--accent);
  position: relative;
  display: inline-block;
}

.hero-name .highlight::after {
  content: '';
  position: absolute;
  bottom: 0.08em;
  left: -0.04em;
  right: -0.04em;
  height: 0.12em;
  background: var(--accent);
  border-radius: 0.06em;
  opacity: 0.3;
}

.hero-sub {
  font-size: var(--fs-body);
  color: var(--text-muted);
  max-width: 32ch;
  line-height: 1.8;
}

.hero-visual {
  position: relative;
  aspect-ratio: 3/4;
  overflow: hidden;
}

.hero-photo-wrapper {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
  border-radius: 2px;
}

.hero-photo-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: grayscale(15%) contrast(105%);
  transition: filter 0.6s ease;
}

.hero-photo-wrapper:hover img {
  filter: grayscale(0%) contrast(100%);
}

.hero-accent-line {
  position: absolute;
  top: -1rem;
  right: -1rem;
  width: 40%;
  height: 1px;
  background: var(--accent);
  transform-origin: right;
}

.hero-accent-dot {
  position: absolute;
  bottom: -0.75rem;
  left: -0.75rem;
  width: 1.5rem;
  height: 1.5rem;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.6;
}

/* Fade reveal */
.reveal {
  opacity: 0;
  transform: translateY(2rem);
  transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}
.reveal.visible { opacity: 1; transform: translateY(0); }
.reveal-delay-1 { transition-delay: 0.1s; }
.reveal-delay-2 { transition-delay: 0.2s; }
.reveal-delay-3 { transition-delay: 0.3s; }

/* Quote strip */
.quote-strip {
  padding: clamp(4rem, 8vw, 8rem);
  text-align: center;
  position: relative;
}

.quote-strip::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 1px;
  height: 4rem;
  background: var(--border);
}

.quote-text {
  font-family: "Noto Serif SC", serif;
  font-size: clamp(1.5rem, 4vw, 2.5rem);
  font-weight: 700;
  line-height: 1.5;
  max-width: 28ch;
  margin: 0 auto 2rem;
  color: var(--text);
}

.quote-author {
  font-size: var(--fs-small);
  color: var(--text-muted);
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

/* Manifesto */
.manifesto {
  padding: 0 clamp(2rem, 8vw, 8rem) clamp(4rem, 8vw, 8rem);
}

.manifesto-grid {
  max-width: 900px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: clamp(3rem, 6vw, 6rem);
}

.manifesto-label {
  font-size: var(--fs-small);
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--text-muted);
  font-weight: 700;
  margin-bottom: 2rem;
}

.manifesto-text {
  font-family: "Noto Serif SC", serif;
  font-size: clamp(1.1rem, 2vw, 1.35rem);
  line-height: 2;
  color: var(--text);
}

.manifesto-text .accent { color: var(--accent); font-weight: 700; }

/* Contact */
.contact-section {
  padding: clamp(3rem, 6vw, 6rem) clamp(2rem, 8vw, 8rem);
  background: var(--surface);
}

.contact-grid {
  max-width: 900px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
}

.contact-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: clamp(1.5rem, 3vw, 2.5rem);
  text-decoration: none;
  color: var(--text);
  transition: all 0.3s ease;
  position: relative;
  background: var(--surface);
  border-radius: 2px;
}

.contact-item:hover {
  background: var(--text);
  color: var(--bg);
}

.contact-item .contact-icon {
  width: 28px; height: 28px;
  margin-bottom: 0.75rem;
  transition: transform 0.3s ease;
}

.contact-item:hover .contact-icon { transform: translateY(-2px); }

.contact-label {
  font-size: var(--fs-small);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 700;
  margin-bottom: 0.25rem;
  color: inherit;
  opacity: 0.6;
}

.contact-value {
  font-size: var(--fs-body);
  font-weight: 600;
  color: inherit;
}

/* Footer */
footer {
  padding: clamp(2rem, 4vw, 4rem) clamp(2rem, 8vw, 8rem);
  text-align: center;
  font-size: var(--fs-small);
  color: var(--text-muted);
  opacity: 0.5;
}

/* Section dividers */
.section-rule {
  max-width: 900px;
  margin: 0 auto;
  height: 1px;
  background: var(--border);
  opacity: 0;
}

/* Location badge */
.location-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  font-size: var(--fs-small);
  color: var(--text-muted);
  font-weight: 600;
  padding: 0.25rem 0;
  margin-top: 2rem;
}

.location-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse-dot 2s ease-in-out infinite;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.5); }
}

@media (max-width: 768px) {
  .hero-content { grid-template-columns: 1fr; gap: 3rem; }
  .hero-visual { order: -1; max-width: 280px; aspect-ratio: 1/1; border-radius: 50%; margin: 0 auto; }
  .hero-photo-wrapper { border-radius: 50%; }
  .hero-accent-line, .hero-accent-dot { display: none; }
  .manifesto-grid { grid-template-columns: 1fr; }
  .contact-grid { grid-template-columns: 1fr; }
  .hero { padding: 6rem 1.5rem 3rem; }
}

@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>

<nav>
  <span class="nav-logo">JYC</span>
  <button class="music-btn" id="musicToggle" aria-label="Toggle music">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="5" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      <path d="M8 18V5l12-2v11"/>
    </svg>
  </button>
</nav>

<section class="hero">
  <div class="hero-content">
    <div class="hero-text">
      <p class="hero-tag reveal">个人数字领地</p>
      <h1 class="hero-name reveal reveal-delay-1">
        Journey<br>
        <span class="highlight">Yields</span><br>
        Crescent
      </h1>
      <p class="hero-sub reveal reveal-delay-2">
        去接受平安普通的自己，不以物喜，不以己悲。
      </p>
      <div class="location-badge reveal reveal-delay-3">
        <span class="location-dot"></span>
        上海 · SHANGHAI
      </div>
    </div>
    <div class="hero-visual reveal reveal-delay-1">
      <div class="hero-photo-wrapper">
        <img src="JYC.jpg" alt="JYC" loading="eager">
        <span class="hero-accent-line"></span>
        <span class="hero-accent-dot"></span>
      </div>
    </div>
  </div>
</section>

<section class="quote-strip">
  <div class="reveal">
    <p class="quote-text">清醒自持，温柔且有锋芒。<br>走过漫长独行的路途，所有沉淀与奔赴，<br>终会迎来属于自己的弯月星光。</p>
    <p class="quote-author">— Journey Yields Crescent</p>
  </div>
</section>

<div class="section-rule reveal"></div>

<section class="manifesto">
  <div class="manifesto-grid">
    <div class="reveal">
      <p class="manifesto-label">关于</p>
      <p class="manifesto-text">
        慢慢来，<span class="accent">一切皆有回音</span>。
      </p>
    </div>
    <div class="reveal reveal-delay-1">
      <p class="manifesto-label">信念</p>
      <p class="manifesto-text">
        风犬少年的天空下，做一个清醒而温柔的人。
      </p>
    </div>
  </div>
</section>

<section class="contact-section" id="contact">
  <div class="contact-grid">
    <a href="https://www.instagram.com/aeo.ju" target="_blank" rel="noopener" class="contact-item reveal">
      <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5"/>
      </svg>
      <span class="contact-label">Instagram</span>
      <span class="contact-value">aeo.ju</span>
    </a>
    <div class="contact-item reveal reveal-delay-1">
      <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M8 10.5h8M8 14h5M6 5h12a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2z"/>
      </svg>
      <span class="contact-label">微信</span>
      <span class="contact-value">aeo_cn</span>
    </div>
    <a href="mailto:apero.ju@gmail.com" class="contact-item reveal reveal-delay-2">
      <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/>
      </svg>
      <span class="contact-label">Email</span>
      <span class="contact-value">apero.ju@gmail.com</span>
    </a>
  </div>
</section>

<footer>
  <p>&copy; 2026 jujujuhappy.win</p>
</footer>

<audio id="bgm" src="JYC.mp3" loop preload="none"></audio>

<script>
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
    }
  });
}, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

const musicBtn = document.getElementById('musicToggle');
const bgm = document.getElementById('bgm');
let isPlaying = false;

musicBtn.addEventListener('click', () => {
  if (isPlaying) {
    bgm.pause();
    musicBtn.classList.remove('playing');
    isPlaying = false;
  } else {
    bgm.play().then(() => {
      musicBtn.classList.add('playing');
      isPlaying = true;
    }).catch(() => {});
  }
});
</script>

</body>
</html>
