<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#23206b">
<title>Journey Yields Crescent — 北海道</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --snow:#f9f7f4; --snow-deep:#f0ece6;
  --lavender:#b8a6c4; --lavender-light:#d4c8dc; --lavender-deep:#7a6b8a;
  --ink:#2c2c2c; --ink-light:#5a5a5a;
  /* iOS 27 Liquid Glass: layered glass, fixed top/bottom edge highlights, no motion shimmer */
  --glass-hi:rgba(255,255,255,.55);
  --glass-line:rgba(255,255,255,.65);
}
html,body{height:100%}
body{
  font-family:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#14102e;color:#fff;overflow:hidden;-webkit-font-smoothing:antialiased;
}
.serif{font-family:"Noto Serif SC","Songti SC",serif}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
a{color:inherit;text-decoration:none}

/* ---------- stage / phone frame ---------- */
.stage{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px}
.stage-hint{color:rgba(255,255,255,.45);font-size:12px;letter-spacing:.18em;text-align:center}
.phone{
  position:relative;width:min(390px,100vw);height:min(844px,100dvh);
  border-radius:54px;overflow:hidden;flex:none;
  background:linear-gradient(180deg,#23206b 0%,#3a2a7d 22%,#5a3394 46%,#8a44a0 70%,#c05f9e 100%);
  box-shadow:0 0 0 11px #1c1c22,0 0 0 13px #3a3a44,0 40px 90px rgba(0,0,0,.7);
}
@media (max-width:480px){
  .stage{padding:0;gap:0}
  .stage-hint{display:none}
  .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
}

/* ---------- status bar ---------- */
.statusbar{
  position:absolute;top:0;left:0;right:0;z-index:50;height:52px;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 28px 0;color:#fff;pointer-events:none;
}
.statusbar .sb-time{font-size:15px;font-weight:600;letter-spacing:.03em}
.statusbar .sb-icons{display:flex;align-items:center;gap:6px}
.statusbar svg{display:block}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;transition:transform .55s cubic-bezier(.32,.72,.24,1),opacity .45s}
.screen.hidden{transform:translateY(-100%);opacity:0;pointer-events:none}

/* lock screen (per screenshot: date, huge time, avatar, name, pill) */
#lockScreen{align-items:center;text-align:center;padding:118px 24px 40px;cursor:pointer}
.lock-date{font-size:19px;font-weight:500;letter-spacing:.1em;text-shadow:0 1px 14px rgba(0,0,0,.35)}
.lock-time{font-size:104px;font-weight:800;line-height:1.08;letter-spacing:-.02em;text-shadow:0 2px 28px rgba(0,0,0,.3)}
.lock-avatar{width:112px;height:112px;border-radius:50%;overflow:hidden;margin-top:19vh;
  border:3px solid rgba(255,255,255,.85);box-shadow:0 12px 34px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.7)}
.lock-avatar img{width:100%;height:100%;object-fit:cover}
.lock-name{margin-top:16px;font-size:21px;font-weight:600;letter-spacing:.04em;text-shadow:0 1px 12px rgba(0,0,0,.4)}
.lock-enter{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.lock-pill{padding:13px 34px;border-radius:999px;background:rgba(255,255,255,.26);
  backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);
  border:1px solid rgba(255,255,255,.55);font-size:16px;font-weight:500;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(255,255,255,.2),0 10px 26px rgba(10,5,40,.3)}
.lock-hint{font-size:12px;letter-spacing:.22em;color:rgba(255,255,255,.7);animation:floatY 2.4s ease-in-out infinite}
@keyframes floatY{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-5px);opacity:1}}

/* home screen (per screenshot: 4-col grid, 2 rows, dock of 4) */
#homeScreen{opacity:0;pointer-events:none}
#homeScreen.show{opacity:1;pointer-events:auto}
.home-scroll{flex:1;overflow-y:auto;padding:74px 22px 10px;scrollbar-width:none}
.home-scroll::-webkit-scrollbar{display:none}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 10px;padding:8px 2px 6px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px}
.app-icon{
  width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  font-size:27px;position:relative;overflow:hidden;flex:none;
  box-shadow:0 10px 22px rgba(10,5,40,.4),
    inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(255,255,255,.22),
    inset 1px 0 0 rgba(255,255,255,.14),inset -1px 0 0 rgba(255,255,255,.14);
  transition:transform .15s;
}
.app:active .app-icon{transform:scale(.88)}
.app-icon::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.07) 34%,transparent 58%)}
.app-icon::after{content:"";position:absolute;left:10%;right:10%;bottom:0;height:24%;pointer-events:none;
  background:linear-gradient(0deg,rgba(255,255,255,.2),transparent)}
.app-icon img{width:100%;height:100%;object-fit:cover;display:block}
.app-icon .glyph{font-family:"Noto Serif SC",serif;font-weight:700;position:relative;z-index:1;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.app-icon svg{width:34px;height:34px;display:block;position:relative;z-index:1}
.app-icon.t-black{background:linear-gradient(145deg,#2b2b30,#000)}
.app-icon.t-ig{background:#000}
.app-icon.t-red{background:linear-gradient(145deg,#f66a5e,#dd2f2a)}
.app-icon.t-pink{background:linear-gradient(145deg,#f78dab,#ec6a94)}
.app-icon.t-orange{background:linear-gradient(145deg,#f2ab45,#ea8a1e)}
.app-icon.t-green{background:#07c160}
.app-icon.t-dark{background:linear-gradient(145deg,#3a2f5e,#17122b)}
.app-icon.t-finder{background:linear-gradient(145deg,#6db3f2,#1e6fd9)}
.app-icon.t-safari{background:linear-gradient(145deg,#eef4fb,#fff)}
.app-icon.t-contact{background:linear-gradient(145deg,#c9a86a,#8a6a35)}
.app-icon .badge{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:9px;
  background:#ff3b30;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.app-icon .badge[hidden]{display:none}
.app-label{font-size:12.5px;font-weight:500;text-shadow:0 1px 8px rgba(0,0,0,.45);text-align:center;white-space:nowrap}
.mini-player{
  display:none;margin:10px 2px;border-radius:18px;padding:10px 14px;
  background:rgba(23,18,43,.5);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);
  border:1px solid rgba(255,255,255,.4);align-items:center;gap:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 26px rgba(10,5,40,.3);
}
.mini-player.show{display:flex}
.mini-player img{width:38px;height:38px;border-radius:9px;object-fit:cover}
.mini-player .mp-text{flex:1;min-width:0}
.mini-player .mp-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-player .mp-sub{font-size:11px;color:rgba(255,255,255,.7)}
.mini-player .mp-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);font-size:15px;display:flex;align-items:center;justify-content:center}
.dock{
  margin:0 14px 16px;border-radius:30px;padding:12px 14px;
  background:rgba(255,255,255,.3);backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7);
  border:1px solid rgba(255,255,255,.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(255,255,255,.18),0 14px 34px rgba(10,5,40,.35);
  display:flex;justify-content:space-around;
}
.dock .app-icon{width:58px;height:58px;border-radius:16px}
.dock .app-label{display:none}

/* ---------- app view ---------- */
.app-view{
  position:absolute;inset:0;z-index:40;background:var(--snow);color:var(--ink);
  transform:translateY(102%);transition:transform .45s cubic-bezier(.32,.72,.24,1);
  display:flex;flex-direction:column;
}
.app-view.open{transform:translateY(0)}
.app-bar{
  flex:none;padding:56px 18px 12px;display:flex;align-items:center;justify-content:space-between;
  background:rgba(249,247,244,.72);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);
  border-bottom:1px solid rgba(255,255,255,.65);box-shadow:0 1px 0 rgba(0,0,0,.04);position:relative;z-index:2;
}
.app-bar .ab-title{font-size:17px;font-weight:600}
.app-bar .ab-close{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.55);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 4px 12px rgba(0,0,0,.12);
  display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1}
.app-bar .ab-spacer{width:32px}
.app-body{flex:1;overflow-y:auto;padding:26px 26px 44px;line-height:2}
.app-body.dark{background:#101014;color:#e8e8ec}
.app-body h2{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:600;line-height:1.4;margin-bottom:6px}
.app-body .loc{font-size:12px;color:var(--lavender-deep);letter-spacing:.15em;font-weight:500;margin-bottom:14px}
.app-body .loc::before{content:"✦ ";color:var(--lavender);font-size:10px}
.app-body p{font-size:15px;color:var(--ink-light);font-weight:300}
.app-body .hero-big{font-family:"Noto Serif SC",serif;font-size:52px;font-weight:700;line-height:1.25;color:var(--ink)}
.app-body .hero-big .hl{color:var(--lavender)}
.app-body .pre{font-size:12px;letter-spacing:.34em;color:var(--lavender-deep);font-weight:500;text-transform:uppercase;margin-bottom:12px}
.app-body .center{text-align:center}
.app-body .photo{width:100%;border-radius:6px;overflow:hidden;margin:8px 0 16px;border:1px solid var(--lavender-light)}
.app-body .photo img{width:100%;display:block}
.app-body .quote-mark{font-size:44px;color:var(--lavender-light);line-height:1}
.app-body .quote{font-family:"Noto Serif SC",serif;font-size:24px;font-weight:600;line-height:1.8;max-width:24ch;margin:0 auto 14px;color:var(--ink)}
.app-body .divider{width:40px;height:2px;background:var(--lavender);margin:0 auto 12px}
.app-body .attr{font-size:12px;color:var(--ink-light);letter-spacing:.15em;font-weight:500}
.kanji-row{display:flex;justify-content:space-around;gap:8px;padding:16px 0;flex-wrap:wrap}
.kanji-cell{text-align:center;min-width:64px}
.kanji-cell .kc{font-family:"Noto Serif SC",serif;font-size:44px;color:var(--lavender);font-weight:700;line-height:1.1;opacity:.85}
.kanji-cell .kr{font-size:12px;color:var(--lavender-deep);letter-spacing:.1em;margin-top:6px}
.foot{font-size:12px;color:var(--ink-light);opacity:.55;text-align:center;margin-top:24px}
/* finder */
.finder-side{font-size:12.5px;color:#888;margin-bottom:6px}
.finder-side span{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.8);color:#777;margin:0 4px 6px 0}
.finder-side span.on{background:rgba(184,166,196,.45);color:var(--ink);font-weight:500}
.finder-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
.finder-table th{text-align:left;font-size:11px;color:#999;font-weight:500;padding:6px 8px;border-bottom:1px solid rgba(0,0,0,.08)}
.finder-table td{padding:11px 8px;border-bottom:1px solid rgba(0,0,0,.04)}
.finder-table tr.frow{cursor:pointer}
.finder-table tr.frow:hover td{background:rgba(184,166,196,.14)}
.finder-table .fname{font-weight:500;color:var(--ink)}
.finder-foot{font-size:12px;color:#999;margin-top:12px}
/* terminal */
.term{font-family:"JetBrains Mono",monospace;font-size:13px;line-height:1.9;color:#d8e6d8;min-height:320px}
.term .tp{color:#7dd87d}
.term .to{color:#f0b429}
.term .tdim{color:#8a8f98}
.term-out{white-space:pre-wrap;word-break:break-word}
.term-input-row{display:flex;gap:8px;align-items:center;margin-top:4px}
.term-input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-family:inherit;font-size:13px}
/* contacts */
.contact-list{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.contact-row{display:flex;align-items:center;gap:14px;padding:16px;background:rgba(255,255,255,.68);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:18px;text-decoration:none;color:var(--ink);
  border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 8px 20px rgba(60,40,90,.1);
  cursor:pointer;text-align:left;width:100%}
.contact-row .ci{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#cbbcd8,#8f7ba6);color:#fff;font-weight:700;font-size:18px}
.contact-row .cl{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-light)}
.contact-row .cv{font-size:15px;font-weight:500}
.contact-row .go{margin-left:auto;color:#c8c8c8;font-size:18px}
.contact-detail{margin-top:16px;padding:20px;background:rgba(255,255,255,.68);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:18px;text-align:center;border:1px solid rgba(255,255,255,.75);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 8px 20px rgba(60,40,90,.1)}
.contact-detail .cd-av{width:76px;height:76px;border-radius:50%;margin:0 auto 10px;overflow:hidden;
  background:linear-gradient(145deg,#cbbcd8,#8f7ba6);display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;font-weight:700}
.contact-detail h3{font-size:17px;font-weight:600}
.contact-detail .cd-sub{font-size:12.5px;color:#999;margin:4px 0 12px}
.chip-btn{display:inline-block;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.6);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 4px 12px rgba(60,40,90,.1);
  font-size:13px;color:#333}
.chip-btn:hover{background:#e2e6ea}
/* music */
.player-art{width:100%;aspect-ratio:1;border-radius:18px;overflow:hidden;margin:4px 0 20px;box-shadow:0 18px 40px rgba(60,40,90,.25),inset 0 1px 0 rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.6)}
.player-art img{width:100%;height:100%;object-fit:cover;display:block}
.player-track{font-size:21px;font-weight:600;text-align:center}
.player-artist{font-size:13px;color:var(--ink-light);text-align:center;margin:6px 0 22px;letter-spacing:.08em}
.progress{height:5px;border-radius:3px;background:rgba(0,0,0,.1);overflow:hidden;cursor:pointer}
.progress i{display:block;height:100%;width:0%;background:var(--lavender-deep);border-radius:3px}
.time-row{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-light);margin:8px 0 20px}
.player-controls{display:flex;align-items:center;justify-content:center;gap:34px}
.play-btn{width:72px;height:72px;border-radius:50%;background:linear-gradient(180deg,#4a4a52,#1c1c22);color:#fff;font-size:24px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.12),0 10px 24px rgba(0,0,0,.3)}
.player-note{text-align:center;font-size:12px;color:var(--ink-light);margin-top:20px;letter-spacing:.06em}
.wx-card{max-width:340px;margin:0 auto;text-align:center}
.wx-ava{width:72px;height:72px;border-radius:50%;margin:0 auto 12px;overflow:hidden;border:3px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.wx-ava img{width:100%;height:100%;object-fit:cover}
.wx-id{font-size:22px;font-weight:700}
.wx-sub{font-size:12.5px;color:#999;margin:6px 0 16px}
.wx-copy{padding:10px 22px;border-radius:999px;background:linear-gradient(180deg,#2ee585,#07b95e);color:#fff;font-size:14px;font-weight:600;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 18px rgba(7,193,96,.35)}
.wx-note{font-size:12px;color:#999;margin-top:14px;line-height:1.8}
@media (prefers-reduced-motion:reduce){
  .screen,.app-view{transition:none}
  .lock-hint{animation:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="statusbar">
      <span class="sb-time" id="sbTime">--:--</span>
      <span class="sb-icons" aria-hidden="true">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="#fff"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 12" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.2a10 10 0 0 1 13 0M4 7a6.5 6.5 0 0 1 8 0M6.6 9.6a3 3 0 0 1 2.8 0"/><circle cx="8" cy="11" r=".9" fill="#fff" stroke="none"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="15" height="8" rx="2" fill="#fff"/><path d="M23.5 4v4a2.2 2.2 0 0 0 0-4Z" fill="#fff" opacity=".5"/></svg>
      </span>
    </div>

    <!-- Lock screen -->
    <section class="screen" id="lockScreen" role="button" aria-label="点击进入主屏幕" tabindex="0">
      <div class="lock-date" id="lockDate">--月--日 星期--</div>
      <div class="lock-time" id="lockTime">--:--</div>
      <div class="lock-avatar"><img src="JYC.jpg" alt="JYC"></div>
      <div class="lock-name">Journey Yields Crescent</div>
      <div class="lock-enter">
        <div class="lock-pill">进入主页</div>
        <div class="lock-hint">上 滑 进 入 ⌃</div>
      </div>
    </section>

    <!-- Home screen -->
    <section class="screen" id="homeScreen">
      <div class="home-scroll">
        <div class="app-grid">
          <button class="app" data-app="safari">
            <span class="app-icon t-black"><span class="glyph">清</span></span>
            <span class="app-label">清醒</span>
          </button>
          <a class="app" href="https://www.instagram.com/aeo.ju" target="_blank" rel="noopener">
            <span class="app-icon t-ig"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.4"/><circle cx="17.4" cy="6.6" r="1.3" fill="#fff" stroke="none"/></svg></span>
            <span class="app-label">Instagram</span>
          </a>
          <button class="app" data-app="photos">
            <span class="app-icon t-red"><span class="glyph">◐</span></span>
            <span class="app-label">相册</span>
          </button>
          <button class="app" data-app="music">
            <span class="app-icon t-pink"><span class="glyph">♫</span><span class="badge" id="musicBadge" hidden>1</span></span>
            <span class="app-label">音乐</span>
          </button>
          <button class="app" data-app="quote">
            <span class="app-icon t-orange"><span class="glyph">❅</span></span>
            <span class="app-label">语录</span>
          </button>
          <button class="app" data-app="wechat">

<script>
// ---- live clock ----
const WEEK=["日","一","二","三","四","五","六"];
function tick(){
  const d=new Date();
  const hh=String(d.getHours()).padStart(2,"0"), mm=String(d.getMinutes()).padStart(2,"0");
  document.getElementById("sbTime").textContent=hh+":"+mm;
  document.getElementById("lockTime").textContent=hh+":"+mm;
  document.getElementById("lockDate").textContent=(d.getMonth()+1)+"月"+d.getDate()+"日 星期"+WEEK[d.getDay()];
}
tick(); setInterval(tick,10000);

// ---- lock -> home ----
const lock=document.getElementById("lockScreen"), home=document.getElementById("homeScreen");
let startY=null, unlocked=false;
function unlock(){
  if(unlocked) return; unlocked=true;
  lock.classList.add("hidden"); home.classList.add("show");
}
lock.addEventListener("click",unlock);
lock.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();unlock();}});
lock.addEventListener("touchstart",e=>{startY=e.touches[0].clientY;},{passive:true});
lock.addEventListener("touchend",e=>{
  if(startY!==null && startY-e.changedTouches[0].clientY>40) unlock();
  startY=null;
},{passive:true});

// ---- apps ----
const APPS={
  safari:{title:"清醒",dark:false,html:'<p class="pre">HOKKAIDO</p><div class="hero-big">清醒<span class="hl">自持</span></div><p style="margin-top:16px">Journey Yields Crescent<br>不以物喜，不以己悲。</p><div class="photo" style="margin-top:22px"><img src="JYC.jpg" alt="JYC"></div><h2>Journey Yields Crescent</h2><div class="loc">上海 · SHANGHAI</div><p>走过漫长独行的路途，<br>温柔且有锋芒。<br>所有沉淀与奔赴，<br>终会迎来属于自己的弯月星光。</p><div class="center" style="margin-top:26px"><div class="quote-mark">❅</div><p class="quote">「慢慢来，一切皆有回音。」</p><div class="divider"></div><p class="attr">风犬少年的天空</p></div><div class="kanji-row"><div class="kanji-cell"><div class="kc">静</div><div class="kr">静けさ</div></div><div class="kanji-cell"><div class="kc">雪</div><div class="kr">ゆき</div></div><div class="kanji-cell"><div class="kc">月</div><div class="kr">つき</div></div><div class="kanji-cell"><div class="kc">風</div><div class="kr">かぜ</div></div></div><p class="foot">© 2026 jujujuhappy.win</p>'},
  finder:{title:"访达 · 文档",dark:false,html:'<div class="finder-side"><span class="on">全部</span><span>清醒</span><span>语录</span><span>静雪月风</span><span>音乐</span><span>相册</span></div><table class="finder-table"><thead><tr><th>名称</th><th>种类</th><th>大小</th></tr></thead><tbody><tr class="frow" data-app="safari"><td class="fname">清醒自持.txt</td><td>文稿</td><td>—</td></tr><tr class="frow" data-app="photos"><td class="fname">JYC.jpg</td><td>图片</td><td>361 KB</td></tr><tr class="frow" data-app="music"><td class="fname">风犬少年的天空.mp3</td><td>音乐</td><td>8.7 MB</td></tr><tr class="frow" data-app="quote"><td class="fname">慢慢来，一切皆有回音.txt</td><td>文稿</td><td>—</td></tr><tr class="frow" data-app="kanji"><td class="fname">静雪月风.txt</td><td>文稿</td><td>—</td></tr><tr class="frow" data-app="contacts"><td class="fname">联系方式.vcf</td><td>通讯录</td><td>—</td></tr></tbody></table><p class="finder-foot">6 个项目 · jujujuhappy.win</p>'},
  terminal:{title:"终端",dark:true,html:'<div class="term"><div class="term-out" id="termOut"><span class="tp">jyc@os ~ $</span> jyc --about\n<span class="to">Journey Yields Crescent v2026</span>\n清醒自持 · 不以物喜，不以己悲。\n走过漫长独行的路途，温柔且有锋芒。\n所有沉淀与奔赴，终会迎来属于自己的弯月星光。\n<span class="tdim"># 输入 help 查看可用命令，回车执行。</span></div><div class="term-input-row"><span class="tp">jyc@os ~ $</span><input class="term-input" id="termInput" type="text" autocomplete="off" spellcheck="false" aria-label="终端输入"></div></div>'},
  contacts:{title:"通讯录",dark:false,html:'<h2>連絡</h2><div class="contact-list"><button class="contact-row" data-contact="ig"><span class="ci">◎</span><span><span class="cl">Instagram</span><br><span class="cv">aeo.ju</span></span><span class="go">›</span></button><button class="contact-row" data-contact="wx"><span class="ci" style="background:linear-gradient(145deg,#3ecf7a,#07c160)">微</span><span><span class="cl">微信</span><br><span class="cv">aeo_cn</span></span><span class="go">›</span></button><button class="contact-row" data-contact="mail"><span class="ci" style="background:linear-gradient(145deg,#8fb4d9,#4a6a8a)">@</span><span><span class="cl">Email</span><br><span class="cv">apero.ju@gmail.com</span></span><span class="go">›</span></button></div><div class="contact-detail" id="contactDetail"></div><p class="foot">3 张名片 · © 2026 jujujuhappy.win</p>'},
  music:{title:"音乐",dark:false,html:'<div class="player-art"><img src="JYC.jpg" alt="风犬少年的天空"></div><div class="player-track">风犬少年的天空</div><div class="player-artist">Journey Yields Crescent</div><div class="progress" id="progress"><i id="progressFill"></i></div><div class="time-row"><span id="curTime">0:00</span><span id="durTime">0:00</span></div><div class="player-controls"><button class="play-btn" id="bigPlayBtn" aria-label="播放或暂停">▶</button></div><p class="player-note">点 ▶ 播放 · 循环播放</p>'},
  photos:{title:"相册",dark:false,html:'<div class="photo"><img src="JYC.jpg" alt="JYC"></div><p class="center">JYC — 上海 · 夜</p>'},
  quote:{title:"语录",dark:false,html:'<div class="center"><div class="quote-mark">❅</div><p class="quote">「慢慢来，一切皆有回音。」</p><div class="divider"></div><p class="attr">风犬少年的天空</p></div>'},
  kanji:{title:"静雪月风",dark:false,html:'<div class="kanji-row"><div class="kanji-cell"><div class="kc">静</div><div class="kr">静けさ</div></div><div class="kanji-cell"><div class="kc">雪</div><div class="kr">ゆき</div></div><div class="kanji-cell"><div class="kc">月</div><div class="kr">つき</div></div><div class="kanji-cell"><div class="kc">風</div><div class="kr">かぜ</div></div></div><p class="center">静 · 雪 · 月 · 風</p>'},
  wechat:{title:"微信",dark:false,html:'<div class="wx-card"><div class="wx-ava"><img src="JYC.jpg" alt="JYC"></div><div class="wx-id">aeo_cn</div><div class="wx-sub">Journey Yields Crescent · 上海</div><button class="wx-copy" id="wxCopyBtn">复制微信号</button><p class="wx-note" id="wxNote">在微信里搜索 aeo_cn 加好友</p></div>'}
};
const CONTACTS={
  ig:{av:"◎",name:"Instagram",sub:"aeo.ju",btn:'<a class="chip-btn" href="https://www.instagram.com/aeo.ju" target="_blank" rel="noopener">打开 Instagram ›</a>'},
  wx:{av:"微",name:"微信",sub:"aeo_cn",btn:'<button class="chip-btn" id="cdWxCopy">复制微信号</button>'},
  mail:{av:"@",name:"Email",sub:"apero.ju@gmail.com",btn:'<a class="chip-btn" href="mailto:apero.ju@gmail.com">写邮件 ›</a>'}
};
const view=document.getElementById("appView"),
      appTitle=document.getElementById("appTitle"),
      appBody=document.getElementById("appBody");
function openApp(name){
  const a=APPS[name]; if(!a) return;
  appTitle.textContent=a.title; appBody.innerHTML=a.html;
  appBody.classList.toggle("dark",!!a.dark);
  appBody.scrollTop=0; view.classList.add("open"); view.setAttribute("aria-hidden","false");
  appBody.querySelectorAll("[data-app]").forEach(el=>el.addEventListener("click",()=>openApp(el.dataset.app)));
  appBody.querySelectorAll("[data-contact]").forEach(el=>el.addEventListener("click",()=>renderContact(el.dataset.contact)));
  if(name==="music") bindPlayer();
  if(name==="terminal") bindTerminal();
  if(name==="contacts") renderContact("ig");
  if(name==="wechat"){
    document.getElementById("wxCopyBtn").addEventListener("click",function(){
      copyText("aeo_cn",this);
      document.getElementById("wxNote").textContent="已复制微信号 aeo_cn";
    });
  }
}
function closeApp(){ view.classList.remove("open"); view.setAttribute("aria-hidden","true"); }
document.querySelectorAll("[data-app]").forEach(b=>b.addEventListener("click",()=>openApp(b.dataset.app)));
document.getElementById("appClose").addEventListener("click",closeApp);

// ---- contacts ----
function renderContact(key){
  const c=CONTACTS[key], d=document.getElementById("contactDetail");
  if(!d) return;
  d.innerHTML='<div class="cd-av">'+c.av+'</div><h3>'+c.name+'</h3><div class="cd-sub">'+c.sub+'</div>'+c.btn;
  const cp=document.getElementById("cdWxCopy");
  if(cp) cp.addEventListener("click",()=>copyText("aeo_cn",cp));
}
function copyText(text,btn){
  const done=()=>{ if(btn){ const old=btn.textContent; btn.textContent="已复制 ✓"; setTimeout(()=>{btn.textContent=old;},1600);} };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(()=>{ fallbackCopy(text); done(); }); }
  else { fallbackCopy(text); done(); }
}
function fallbackCopy(text){
  const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta);
  ta.select(); try{document.execCommand("copy");}catch(e){} document.body.removeChild(ta);
}

// ---- terminal ----
function bindTerminal(){
  const out=document.getElementById("termOut"), inp=document.getElementById("termInput");
  if(!out||!inp) return;
  inp.addEventListener("keydown",e=>{
    if(e.key!=="Enter") return;
    const cmd=inp.value.trim(); inp.value="";
    out.innerHTML+='\n<span class="tp">jyc@os ~ $</span> '+cmd.replace(/</g,"&lt;")+'\n';
    const c=cmd.toLowerCase();
    if(c===""){ }
    else if(c==="help"){ out.innerHTML+='可用命令：about · contact · quote · music · date · clear\n'; }
    else if(c==="about"){ out.innerHTML+='Journey Yields Crescent\n清醒自持 · 不以物喜，不以己悲。\n上海 · SHANGHAI\n走过漫长独行的路途，温柔且有锋芒。\n所有沉淀与奔赴，终会迎来属于自己的弯月星光。\n'; }
    else if(c==="contact"){ out.innerHTML+='Instagram aeo.ju · 微信 aeo_cn · Email apero.ju@gmail.com\n'; }
    else if(c==="quote"){ out.innerHTML+='「慢慢来，一切皆有回音。」—— 风犬少年的天空\n'; }
    else if(c==="music"){ out.innerHTML+='正在播放：风犬少年的天空（JYC.mp3）\n'; togglePlay(true); }
    else if(c==="date"){ out.innerHTML+=new Date().toString()+'\n'; }
    else if(c==="clear"){ out.innerHTML=""; }
    else { out.innerHTML+='未知命令：'+cmd.replace(/</g,"&lt;")+'（输入 help 查看）\n'; }
    appBody.scrollTop=appBody.scrollHeight;
  });
}

// ---- music ----
const bgm=document.getElementById("bgm");
const miniPlayer=document.getElementById("miniPlayer"),
      miniPlayBtn=document.getElementById("miniPlayBtn"),
      musicBadge=document.getElementById("musicBadge");
let playing=false;
function fmt(s){ if(!isFinite(s)||s===0) return "0:00"; s=Math.floor(s); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function syncUI(){
  const big=document.getElementById("bigPlayBtn");
  if(big) big.textContent=playing?"❚❚":"▶";
  miniPlayBtn.textContent=playing?"❚❚":"▶";
  miniPlayer.classList.toggle("show",playing);
  musicBadge.hidden=!playing;
}
function togglePlay(force){
  const want=(typeof force==="boolean")?force:!playing;
  if(want){ bgm.play().then(()=>{playing=true;syncUI();}).catch(()=>{}); }
  else { bgm.pause(); playing=false; syncUI(); }
}
function bindPlayer(){
  const big=document.getElementById("bigPlayBtn");
  if(big) big.addEventListener("click",()=>togglePlay());
  const bar=document.getElementById("progress");
  if(bar) bar.addEventListener("click",e=>{
    const r=bar.getBoundingClientRect();
    if(bgm.duration) bgm.currentTime=((e.clientX-r.left)/r.width)*bgm.duration;
  });
  syncDur(); syncUI();
}
function syncDur(){
  const d=document.getElementById("durTime");
  if(d && bgm.duration) d.textContent=fmt(bgm.duration);
}
miniPlayBtn.addEventListener("click",()=>togglePlay());
bgm.addEventListener("timeupdate",()=>{
  const f=document.getElementById("progressFill");
  if(f && bgm.duration) f.style.width=(bgm.currentTime/bgm.duration*100)+"%";
  const c=document.getElementById("curTime"); if(c) c.textContent=fmt(bgm.currentTime);
  syncDur();
});
bgm.addEventListener("loadedmetadata",syncDur);
bgm.addEventListener("durationchange",syncDur);
bgm.addEventListener("ended",()=>{playing=false;syncUI();});
syncUI();
</script>
